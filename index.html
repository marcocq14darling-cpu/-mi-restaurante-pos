<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>Mi Restaurante POS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f3f4f6;
 color:#111827
}
header{
 background:#111827;
 color:white;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:10
}
h1,h2,h3{margin-top:0}
button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 font-size:16px;
 cursor:pointer
}
nav{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 padding:12px;
 background:white;
 border-bottom:1px solid #ddd
}
nav button{
 background:#e5e7eb
}
nav button.active{
 background:#111827;
 color:white
}
main{
 max-width:1200px;
 margin:auto;
 padding:16px
}
.card{
 background:white;
 border-radius:14px;
 padding:16px;
 margin-bottom:16px;
 box-shadow:0 2px 8px #0001
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:12px
}
.table{
 background:#f9fafb;
 border:2px solid #d1d5db;
 border-radius:14px;
 padding:18px;
 text-align:center;
 min-height:100px
}
.table.open{
 border-color:#16a34a
}
.table.busy{
 border-color:#dc2626
}
input,select{
 width:100%;
 padding:12px;
 border:1px solid #d1d5db;
 border-radius:9px;
 font-size:16px;
 margin:5px 0 10px
}
.primary{background:#111827;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.warning{background:#f59e0b;color:white}
.muted{color:#6b7280}
.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px;
 border-bottom:1px solid #eee
}
.total{
 font-size:24px;
 font-weight:bold;
 text-align:right;
 padding:15px
}
.hidden{display:none!important}
.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px
}
.loginbox{
 width:min(400px,100%);
 background:white;
 padding:25px;
 border-radius:18px;
 box-shadow:0 5px 25px #0002
}
.toast{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#111827;
 color:white;
 padding:14px 18px;
 border-radius:10px;
 z-index:100
}
@media(max-width:600px){
 header h1{font-size:20px}
 nav button{flex:1}
}
</style>
</head>

<body>

<div id="login" class="login">
 <div class="loginbox">
  <h1>🍽️ Mi Restaurante POS</h1>
  <p class="muted">Acceso de administrador</p>

  <label>Usuario</label>
  <input id="user" placeholder="Usuario">

  <label>Contraseña</label>
  <input id="pass" type="password" placeholder="Contraseña">

  <button class="primary" style="width:100%" onclick="login()">
   Ingresar
  </button>

  <p id="loginMsg" class="muted"></p>
 </div>
</div>

<div id="app" class="hidden">

<header>
 <div>
  <h1>🍽️ Mi Restaurante POS</h1>
  <div id="clock"></div>
 </div>
 <button onclick="logout()">Salir</button>
</header>

<nav>
 <button class="active" onclick="showPage('mesas',this)">Mesas</button>
 <button onclick="showPage('cocina',this)">Cocina</button>
 <button onclick="showPage('caja',this)">Caja</button>
 <button onclick="showPage('inventario',this)">Inventario</button>
 <button onclick="showPage('reportes',this)">Reportes</button>
</nav>

<main>

<section id="mesas">

 <div class="card">
  <h2>Mesas</h2>
  <button class="primary" onclick="newOrder()">
   + Nueva orden
  </button>
 </div>

 <div id="tables" class="grid"></div>

</section>

<section id="orden" class="hidden">

 <div class="card">
  <h2 id="orderTitle">Orden</h2>

  <div class="grid" id="menu"></div>

  <hr>

  <h3>Productos</h3>
  <div id="orderItems"></div>

  <div class="total" id="orderTotal">S/ 0.00</div>

  <button class="success" onclick="sendKitchen()">
   👨‍🍳 Enviar a cocina
  </button>

  <button class="danger" onclick="closeOrder()">
   Cerrar
  </button>
 </div>

</section>

<section id="cocina" class="hidden">
 <div class="card">
  <h2>👨‍🍳 Cocina</h2>
  <div id="kitchen"></div>
 </div>
</section>

<section id="caja" class="hidden">
 <div class="card">
  <h2>💰 Caja</h2>

  <button class="success" onclick="openCash()">
   Abrir caja
  </button>

  <button class="warning" onclick="withdraw()">
   Retiro
  </button>

  <h3>Resumen</h3>
  <div id="cash"></div>
 </div>
</section>

<section id="inventario" class="hidden">

 <div class="card">
  <h2>📦 Inventario</h2>

  <input id="productName" placeholder="Nombre del producto">
  <input id="productQty" type="number" placeholder="Cantidad">

  <button class="primary" onclick="addStock()">
   Agregar producto
  </button>
 </div>

 <div class="card">
  <div id="stock"></div>
 </div>

</section>

<section id="reportes" class="hidden">

 <div class="card">
  <h2>📊 Reportes</h2>
  <div id="reports"></div>
 </div>

</section>

</main>
</div>

<div id="toast" class="toast hidden"></div>

<script>

const KEY="mi-restaurante-pos";

const menuDefault=[
 ["Lomo saltado",18],
 ["Arroz chaufa",16],
 ["Pollo a la brasa",20],
 ["Ceviche",22],
 ["Hamburguesa",15],
 ["Papas fritas",8],
 ["Inca Kola",5],
 ["Agua",3]
];

let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 tables:Array.from({length:15},(_,i)=>({
  id:i+1,
  order:null
 })),
 orders:[],
 payments:[],
 stock:[],
 cash:{
  opened:false,
  opening:0
 }
};

let selected=null;

function save(){
 localStorage.setItem(KEY,JSON.stringify(state));
}

function money(x){
 return "S/ "+Number(x||0).toFixed(2);
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.remove("hidden");
 setTimeout(()=>t.classList.add("hidden"),2500);
}

function login(){

 const u=document.getElementById("user").value.trim();
 const p=document.getElementById("pass").value;

 if(u.toLowerCase()==="marco" && p){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
 }else{
  document.getElementById("loginMsg").textContent=
   "Usuario o contraseña incorrectos";
 }
}

function logout(){
 document.getElementById("app").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
}

function showPage(page,btn){

 document.querySelectorAll("main>section").forEach(x=>
  x.classList.add("hidden")
 );

 document.getElementById(page).classList.remove("hidden");

 document.querySelectorAll("nav button").forEach(x=>
  x.classList.remove("active")
 );

 if(btn)btn.classList.add("active");

 if(page==="mesas")renderTables();
 if(page==="cocina")renderKitchen();
 if(page==="caja")renderCash();
 if(page==="inventario")renderStock();
 if(page==="reportes")renderReports();
}

function newOrder(){

 const table=state.tables.find(x=>!x.order);

 if(!table){
  toast("No hay mesas disponibles");
  return;
 }

 table.order={
  id:Date.now(),
  items:[],
  status:"abierta"
 };

 selected=table.id;

 save();
 renderEditor();
}

function openTable(id){

 selected=id;
 renderEditor();
}

function renderTables(){

 const el=document.getElementById("tables");
 el.innerHTML="";

 state.tables.forEach(t=>{

  const div=document.createElement("div");

  div.className="table "+(t.order?"busy":"open");

  div.innerHTML=`
   <h2>Mesa ${t.id}</h2>
   <p>${t.order?"🔴 Ocupada":"🟢 Disponible"}</p>
  `;

  div.onclick=()=>{

   if(t.order){
    openTable(t.id);
   }else{
    t.order={
     id:Date.now(),
     items:[],
     status:"abierta"
    };

    selected=t.id;
    save();
    renderEditor();
   }

  };

  el.appendChild(div);

 });
}

function renderEditor(){

 document.getElementById("mesas").classList.add("hidden");
 document.getElementById("orden").classList.remove("hidden");

 const table=state.tables.find(x=>x.id===selected);

 document.getElementById("orderTitle").textContent=
  "Mesa "+selected;

 const menu=document.getElementById("menu");

 menu.innerHTML="";

 menuDefault.forEach((m,i)=>{

  const b=document.createElement("button");

  b.className="primary";

  b.textContent=m[0]+" - "+money(m[1]);

  b.onclick=()=>addItem(i);

  menu.appendChild(b);

 });

 renderOrderItems();
}

function addItem(i){

 const table=state.tables.find(x=>x.id===selected);

 const product=menuDefault[i];

 let item=table.order.items.find(x=>x.name===product[0]);

 if(item){
  item.qty++;
 }else{
  table.order.items.push({
   name:product[0],
   price:product[1],
   qty:1
  });
 }

 save();
 renderOrderItems();
}

function minusItem(i){

 const table=state.tables.find(x=>x.id===selected);

 table.order.items[i].qty--;

 if(table.order.items[i].qty<=0){
  table.order.items.splice(i,1);
 }

 save();
 renderOrderItems();
}

function renderOrderItems(){

 const table=state.tables.find(x=>x.id===selected);

 const el=document.getElementById("orderItems");

 el.innerHTML="";

 let total=0;

 table.order.items.forEach((x,i)=>{

  total+=x.qty*x.price;

  const div=document.createElement("div");

  div.className="item";

  div.innerHTML=`
   <span>
    ${x.name} x${x.qty}
   </span>
   <span>
    ${money(x.qty*x.price)}
    <button onclick="minusItem(${i})">−</button>
   </span>
  `;

  el.appendChild(div);

 });

 document.getElementById("orderTotal").textContent=money(total);
}

function sendKitchen(){

 const table=state.tables.find(x=>x.id===selected);

 if(!table.order.items.length){
  toast("Agrega productos primero");
  return;
 }

 table.order.status="cocina";

 save();

 toast("Orden enviada a cocina");
}

function closeOrder(){

 const table=state.tables.find(x=>x.id===selected);

 if(!table.order)return;

 const total=table.order.items.reduce(
  (a,x)=>a+x.qty*x.price,0
 );

 state.payments.push({
  id:Date.now(),
  total,
  date:new Date().toISOString()
 });

 state.orders.push(table.order);

 table.order=null;

 save();

 selected=null;

 document.getElementById("orden").classList.add("hidden");
 document.getElementById("mesas").classList.remove("hidden");

 renderTables();

 toast("Orden cerrada");
}

function renderKitchen(){

 const el=document.getElementById("kitchen");

 el.innerHTML="";

 state.tables.forEach(t=>{

  if(!t.order || t.order.status!=="cocina")return;

  const div=document.createElement("div");

  div.className="card";

  div.innerHTML=`
   <h3>Mesa ${t.id}</h3>
   ${t.order.items.map(x=>
    `<p>🍽️ ${x.qty} x ${x.name}</p>`
   ).join("")}
   <button class="success"
    onclick="finishKitchen(${t.id})">
    Lista
   </button>
  `;

  el.appendChild(div);
 });
}

function finishKitchen(id){

 const table=state.tables.find(x=>x.id===id);

 table.order.status="lista";

 save();

 renderKitchen();

 toast("Orden marcada como lista");
}

function openCash(){

 if(state.cash.opened){
  toast("La caja ya está abierta");
  return;
 }

 const amount=Number(prompt("Monto inicial de caja")||0);

 state.cash.opened=true;
 state.cash.opening=amount;

 save();
 renderCash();

 toast("Caja abierta");
}

function withdraw(){

 if(!state.cash.opened){
  toast("Primero abre la caja");
  return;
 }

 const amount=Number(prompt("Monto del retiro")||0);

 state.payments.push({
  id:Date.now(),
  total:-amount,
  type:"retiro",
  date:new Date().toISOString()
 });

 save();
 renderCash();

 toast("Retiro registrado");
}

function renderCash(){

 const sales=state.payments.reduce(
  (a,x)=>a+(x.total>0?x.total:0),0
 );

 const withdrawals=state.payments.reduce(
  (a,x)=>a+(x.total<0?Math.abs(x.total):0),0
 );

 const current=
  state.cash.opening+sales-withdrawals;

 document.getElementById("cash").innerHTML=`
  <p>Estado: ${
   state.cash.opened?"🟢 Abierta":"🔴 Cerrada"
  }</p>
  <p>Apertura: ${money(state.cash.opening)}</p>
  <p>Ventas: ${money(sales)}</p>
  <p>Retiros: ${money(withdrawals)}</p>
  <h2>Total: ${money(current)}</h2>
 `;
}

function addStock(){

 const name=document.getElementById("productName").value.trim();
 const qty=Number(document.getElementById("productQty").value||0);

 if(!name || qty<=0){
  toast("Completa los datos");
  return;
 }

 let item=state.stock.find(x=>x.name===name);

 if(item){
  item.qty+=qty;
 }else{
  state.stock.push({name,qty});
 }

 document.getElementById("productName").value="";
 document.getElementById("productQty").value="";

 save();
 renderStock();

 toast("Producto agregado");
}

function renderStock(){

 const el=document.getElementById("stock");

 el.innerHTML="";

 state.stock.forEach((x,i)=>{

  const div=document.createElement("div");

  div.className="item";

  div.innerHTML=`
   <span>${x.name}</span>
   <strong>${x.qty}</strong>
  `;

  el.appendChild(div);
 });
}

function renderReports(){

 const sales=state.payments.reduce(
  (a,x)=>a+(x.total>0?x.total:0),0
 );

 document.getElementById("reports").innerHTML=`
  <h3>Resumen de ventas</h3>
  <p>Órdenes: ${state.orders.length}</p>
  <p>Ventas totales: ${money(sales)}</p>
  <p>Pagos registrados: ${state.payments.length}</p>
 `;
}

function render(){

 renderTables();
 renderKitchen();
 renderCash();
 renderStock();
 renderReports();
}

setInterval(()=>{
 document.getElementById("clock").textContent=
  new Date().toLocaleString("es-PE");
},1000);

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
// =============================
// 🔐 SISTEMA DE INICIO DE SESIÓN
// =============================

(function(){

  const LOGIN_USERS = {
  "Marco": "1234",
  "Olimpia": "QUINTO2026"
};

  const loginHTML = `
    <div id="loginScreen" style="
      position:fixed;
      inset:0;
      z-index:99999;
      background:#111827;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    ">

      <div style="
        width:100%;
        max-width:420px;
        background:white;
        border-radius:25px;
        padding:35px 25px;
        box-shadow:0 20px 50px rgba(0,0,0,.35);
        text-align:center;
      ">

        <div style="
          width:80px;
          height:80px;
          margin:0 auto 20px;
          border-radius:20px;
          background:#111827;
          color:white;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:40px;
        ">🍽️</div>

        <h1 style="
          margin:0 0 8px;
          color:#111827;
          font-size:28px;
        ">
          Mi Restaurante POS
        </h1>

        <p style="
          color:#6b7280;
          margin-bottom:30px;
        ">
          Inicia sesión para continuar
        </p>

        <input
          id="loginUser"
          type="text"
          placeholder="Usuario"
          autocomplete="username"
          style="
            width:100%;
            padding:16px;
            margin-bottom:15px;
            border:1px solid #d1d5db;
            border-radius:14px;
            font-size:17px;
            box-sizing:border-box;
          "
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          style="
            width:100%;
            padding:16px;
            margin-bottom:15px;
            border:1px solid #d1d5db;
            border-radius:14px;
            font-size:17px;
            box-sizing:border-box;
          "
        >

        <button
          id="loginButton"
          style="
            width:100%;
            padding:17px;
            border:0;
            border-radius:14px;
            background:#111827;
            color:white;
            font-size:18px;
            font-weight:600;
          "
        >
          Ingresar
        </button>

        <p id="loginError" style="
          color:#dc2626;
          margin-top:15px;
          display:none;
        ">
          Usuario o contraseña incorrectos
        </p>

      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", loginHTML);

  const loginScreen = document.getElementById("loginScreen");
  const userInput = document.getElementById("loginUser");
  const passwordInput = document.getElementById("loginPassword");
  const loginButton = document.getElementById("loginButton");
  const loginError = document.getElementById("loginError");

  function login(){

    const user = userInput.value.trim();
    const password = passwordInput.value;

    if(LOGIN_USERS[user] && password === LOGIN_USERS[user]){
      sessionStorage.setItem("posLoggedIn","true");

      loginScreen.remove();

    }else{

      loginError.style.display = "block";
      passwordInput.value = "";
      passwordInput.focus();

    }
  }

  loginButton.addEventListener("click", login);

  passwordInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      login();
    }
  });

  userInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      passwordInput.focus();
    }
  });

  // Si ya inició sesión durante esta sesión,
  // no mostrar nuevamente el login.
  if(sessionStorage.getItem("posLoggedIn") === "true"){
    loginScreen.remove();
  }

})();
</script>

</body>
</html>
